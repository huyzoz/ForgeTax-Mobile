<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- R-27 — the original's own title (not a remake name). -->
  <title>ForgeTax: Blacksmith Legends</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loading" data-i18n="ui.loading">Đang tải…</div>
  <div id="error" style="display:none"></div>

  <div id="app" style="display:none">
    <!-- The forge room IS the UI (LAYOUT.md §9): contract/day/quota/grade/
         value/chances are 3D text on the in-room boards (instrument board,
         Forge Ledger, Meter_Plaque, Round calendar); strikes/tributes/
         next-day are in-scene taps (anvil / bell / ledger). ESC opens the
         pause Menu (F-5: the original's own action buttons + settings).
         F-8: the Fever teal wash is a full-screen DOM overlay driven by
         the scene's Fever amount. F-9c: the Great result is a big
         transient banner. F-10: the title screen is a DOM plaque over
         the 3D room (the original's IMGUI board is screen-space too). -->
    <main id="scene">
      <div id="gl"></div>
    </main>

    <div id="fever-overlay"></div>
    <div id="great-banner"><div class="great-title"></div><div class="great-ratio"></div></div>

    <div id="title-screen" style="display:none">
      <div class="title-plaque">
        <h1>FORGE TAXX</h1>
        <p class="title-start" data-i18n="menu2.startGame">Bắt đầu game</p>
        <div class="title-divider"></div>
        <div class="title-cols">
          <div class="title-col exit"><span data-i18n="start.exit">THOÁT</span><b>1%</b></div>
          <div class="title-col hold"><span data-i18n="ui.bb3ad48c0b">GIỮ NGUYÊN</span><b>49%</b></div>
          <div class="title-col start"><span data-i18n="menu2.startGame">Bắt đầu game</span><b>50%</b></div>
        </div>
        <p class="title-prompt" data-i18n="ui.826f8ad351">Chạm để tiếp tục</p>
      </div>
    </div>

    <div id="toast"></div>
    <div id="fps-counter">-- FPS</div>

    <div id="settings-panel" style="display:none">
      <div class="settings-card">
        <h2 data-i18n="menu2.title">Menu</h2>

        <div class="menu-actions">
          <button id="menu-resume" type="button" class="menu-btn gold" data-i18n="menu2.resume">Tiếp tục</button>
          <button id="menu-codex" type="button" class="menu-btn" disabled data-i18n="menu2.codex">Sổ sưu tập</button>
          <button id="menu-restart" type="button" class="menu-btn" data-i18n="menu2.restart">Chơi lại từ đầu</button>
          <button id="menu-home" type="button" class="menu-btn" data-i18n="menu2.returnTitle">Về màn hình chính</button>
        </div>

        <label class="set-row"><span data-i18n="settings.master">Âm lượng tổng</span>
          <input type="range" id="set-master" min="0" max="100" step="1">
          <span class="set-val" id="set-master-val"></span></label>

        <label class="set-row"><span data-i18n="settings.music">Nhạc · Âm môi trường</span>
          <input type="range" id="set-music" min="0" max="100" step="1">
          <span class="set-val" id="set-music-val"></span></label>

        <label class="set-row"><span data-i18n="settings.sfx">Hiệu ứng âm thanh</span>
          <input type="range" id="set-sfx" min="0" max="100" step="1">
          <span class="set-val" id="set-sfx-val"></span></label>

        <label class="set-row"><span data-i18n="settings.haptics">Rung</span>
          <input type="checkbox" id="set-haptics" disabled>
          <span class="note" data-i18n="ui.haptics_note">Không có động cơ rung trên PC</span></label>

        <label class="set-row"><span data-i18n="settings.brightness">Độ sáng</span>
          <input type="range" id="set-brightness" min="20" max="200" step="1">
          <span class="set-val" id="set-brightness-val"></span></label>

        <label class="set-row"><span data-i18n="settings.quality">Chất lượng đồ họa</span>
          <select id="set-quality">
            <option value="auto" data-i18n="settings.quality.auto">Tự động</option>
            <option value="low" data-i18n="settings.quality.low">Thấp</option>
            <option value="medium" data-i18n="settings.quality.mid">Trung bình</option>
            <option value="high" data-i18n="settings.quality.high">Cao</option>
          </select>
          <span class="note" data-i18n="ui.quality_note"></span></label>

        <label class="set-row"><span data-i18n="settings.fps">Hiện FPS</span>
          <input type="checkbox" id="set-fps"></label>

        <label class="set-row"><span data-i18n="settings.floor_swords">Số kiếm tối đa trên sàn</span>
          <!-- R-20: floorSwordLimit 30 (behavior.json settings_defaults). -->
          <input type="range" id="set-floor" min="0" max="30" step="1">
          <span class="set-val" id="set-floor-val"></span></label>

        <fieldset class="set-row">
          <legend data-i18n="settings.controls">Điều khiển</legend>
          <label><input type="radio" name="controls" id="set-controls-free">
            <span data-i18n="settings.controls_free">Di chuyển tự do</span></label>
          <label><input type="radio" name="controls" id="set-controls-hub">
            <span data-i18n="settings.controls_hub">Góc nhìn cố định</span></label>
        </fieldset>

        <label class="set-row"><span data-i18n="settings.lock_on">Khóa mục tiêu</span>
          <input type="checkbox" id="set-lockon"></label>

        <label class="set-row"><span data-i18n="menu2.language">Ngôn ngữ</span>
          <select id="set-language">
            <option value="vi">Tiếng Việt</option>
            <option value="en">English</option>
          </select>
          <span class="note" data-i18n="menu2.languageHint"></span></label>

        <p class="esc-hint">ESC — <span data-i18n="ui.settings_title">Cài đặt</span></p>
      </div>
    </div>

    <div id="overlay" style="display:none">
      <div class="overlay-card">
        <h1 id="overlay-title"></h1>
        <p id="overlay-sub"></p>
        <button id="overlay-btn-endless" type="button" data-i18n="ui.endless_continue">Tiếp tục (Endless)</button>
        <button id="overlay-btn-new" type="button" data-i18n="ui.new_run">Chơi lại</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="sound.js"></script>
  <script type="module" src="scene3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
